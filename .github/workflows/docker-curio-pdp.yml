name: Docker Curio-PDP

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Image version without v prefix (empty reads build/version.go). Example override 1.28.6-dockery
        required: false
        type: string
        default: ""
      prerelease:
        description: If true, do not also tag latest/calibnet
        type: boolean
        default: true
  # Temporary: first push registers this workflow so `gh workflow run` works
  # before the file exists on main. Remove after the dispatch test succeeds.
  push:
    branches: [feat/dockery]
    paths: [.github/workflows/docker-curio-pdp.yml]

permissions:
  contents: read

jobs:
  push:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            RAW="${{ github.event.release.tag_name }}"
            IS_PRE="${{ github.event.release.prerelease }}"
          else
            RAW="${{ inputs.version }}"
            if [[ -z "$RAW" ]]; then
              RAW="$(scripts/curio-version.sh)"
            fi
            IS_PRE="${{ inputs.prerelease }}"
          fi
          VERSION="${RAW#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          MAINNET_TAGS="filecoin/curio-pdp:${VERSION}"
          CALIBNET_TAGS="filecoin/curio-pdp:${VERSION}-calibnet"
          if [[ "${IS_PRE}" != "true" ]]; then
            MAINNET_TAGS="${MAINNET_TAGS}"$'\n'"filecoin/curio-pdp:latest"
            CALIBNET_TAGS="${CALIBNET_TAGS}"$'\n'"filecoin/curio-pdp:calibnet"
          fi
          {
            echo "mainnet<<EOF"
            echo "${MAINNET_TAGS}"
            echo "EOF"
            echo "calibnet<<EOF"
            echo "${CALIBNET_TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push mainnet
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/skiff/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SKIFF_MAKE_TARGET=skiff
            CURIO_BUILD_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.mainnet }}

      - name: Build and push calibnet
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/skiff/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SKIFF_MAKE_TARGET=calibnet-skiff
            CURIO_BUILD_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ steps.tags.outputs.version }}-calibnet
          tags: ${{ steps.tags.outputs.calibnet }}
