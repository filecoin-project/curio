name: Docker Curio-PDP

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        run: |
          RAW="${{ github.event.release.tag_name }}"
          VERSION="${RAW#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          MAINNET_TAGS="curiostorage/curio-pdp:${VERSION}"
          CALIBNET_TAGS="curiostorage/curio-pdp:${VERSION}-calibnet"
          if [[ "${{ github.event.release.prerelease }}" != "true" ]]; then
            MAINNET_TAGS="${MAINNET_TAGS}"$'\n'"curiostorage/curio-pdp:latest"
            CALIBNET_TAGS="${CALIBNET_TAGS}"$'\n'"curiostorage/curio-pdp:calibnet"
          fi
          {
            echo "mainnet<<EOF"
            echo "${MAINNET_TAGS}"
            echo "EOF"
            echo "calibnet<<EOF"
            echo "${CALIBNET_TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push mainnet
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/skiff/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SKIFF_MAKE_TARGET=skiff
            CURIO_BUILD_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.mainnet }}

      - name: Build and push calibnet
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/skiff/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SKIFF_MAKE_TARGET=calibnet-skiff
            CURIO_BUILD_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ steps.tags.outputs.version }}-calibnet
          tags: ${{ steps.tags.outputs.calibnet }}
