name: skiff

x-logging:
  &default-logging
  options:
    max-size: '20m'
    max-file: '3'
  driver: json-file

# Port metadata for operators and tooling (`docker inspect` reads service labels).
x-skiff-ports: &skiff-ports
  io.curio.skiff.port.4701: "Admin GUI (webrpc, config editor)"
  io.curio.skiff.port.80: "Public PDP HTTP API (HTTP.DelegateTLS=true)"
  io.curio.skiff.port.443: "Public PDP HTTPS API (HTTP.DelegateTLS=false, autocert)"

networks:
  skiff-net:
    driver: bridge

services:
  yugabyte:
    container_name: skiff-yugabyte
    image: ${YUGABYTE_IMAGE:-yugabytedb/yugabyte:2024.1.0.0-b129}
    init: true
    environment:
      - TINI_SUBREAPER=true
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ${YUGABYTE_DATA:-./data/yugabyte}:/home/yugabyte/yb_data
    # Advertise the skiff-net IP (required by yugabyted). Bind YSQL/YCQL on all
    # interfaces so Skiff can use Compose DNS and the healthcheck can use loopback.
    # Do not set hostname: yugabyte — Docker maps that to 127.0.0.2.
    command:
      - /bin/bash
      - -lc
      - |
        ADDR=$$(hostname -I | tr ' ' '\n' | awk '$$1 ~ /^[0-9]+\./ && $$1 !~ /^127\./ {print $$1; exit}')
        if [ -z "$$ADDR" ]; then
          echo "yugabyte: no non-loopback IPv4" >&2
          hostname -I >&2
          exit 1
        fi
        exec bin/yugabyted start \
          --base_dir=/home/yugabyte/yb_data \
          --background=false \
          --advertise_address=$$ADDR \
          --tserver_flags="pgsql_proxy_bind_address=0.0.0.0:5433,cql_proxy_bind_address=0.0.0.0:9042"
    healthcheck:
      test: ["CMD", "/home/yugabyte/bin/ysqlsh", "-h", "127.0.0.1", "-U", "yugabyte", "-d", "yugabyte", "-c", "select 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - skiff-net

  forest:
    container_name: skiff-forest
    image: ${FOREST_IMAGE:-ghcr.io/chainsafe/forest:v0.35.0}
    init: true
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ${FOREST_DATA:-./data/forest}:/root/.local/share/forest
      - ${FOREST_TOKEN_DATA:-./data/forest-token}:/forest-token
    command:
      - --chain=${FOREST_CHAIN:-mainnet}
      - --auto-download-snapshot
      - --rpc-address=0.0.0.0:2345
      - --healthcheck-address=0.0.0.0:2346
      - --save-token=/forest-token/token
      - --encrypt-keystore
      - "false"
    healthcheck:
      # RPC accepting connections is enough to start Curio; full sync continues in the background.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/2345'"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 60s
    networks:
      - skiff-net

  skiff:
    container_name: skiff
    image: ${SKIFF_IMAGE:-filecoin/curio-pdp:dev}
    build:
      context: ../..
      dockerfile: docker/skiff/Dockerfile
      args:
        SKIFF_MAKE_TARGET: ${SKIFF_MAKE_TARGET:-skiff}
    init: true
    depends_on:
      yugabyte:
        condition: service_healthy
      forest:
        condition: service_healthy
    environment:
      - SKIFF_DOCKER=1
      - SKIFF_HTTP_DOMAIN=${SKIFF_HTTP_DOMAIN:-localhost}
      - CURIO_DB_HOST=yugabyte
      - CURIO_HARMONYDB_HOSTS=yugabyte
      - CURIO_DB_PORT=5433
      - CURIO_DB_NAME=yugabyte
      - CURIO_DB_USER=yugabyte
      - CURIO_DB_PASSWORD=yugabyte
      - CURIO_DB_LOAD_BALANCE=false
      - CURIO_REPO_PATH=/var/lib/skiff
      - SKIFF_DATA=/data
      # Optional override. When empty, entrypoint builds FULLNODE_API_INFO from the bundled Forest token.
      - FULLNODE_API_INFO=${FULLNODE_API_INFO:-}
      - FOREST_HOST=${FOREST_HOST:-forest}
      - FOREST_RPC_PORT=${FOREST_RPC_PORT:-2345}
      - FOREST_TOKEN_FILE=${FOREST_TOKEN_FILE:-/forest-token/token}
    restart: unless-stopped
    logging: *default-logging
    labels:
      <<: *skiff-ports
    ports:
      - "127.0.0.1:4701:4701" # Admin GUI (localhost only — not for public internet)
      - "80:80"               # Public PDP HTTP (default when DelegateTLS=true)
      - "443:443"             # Public PDP HTTPS (when DelegateTLS=false)
    volumes:
      - ${SKIFF_REPO_DATA:-./data/skiff}:/var/lib/skiff
      - ${SKIFF_STORAGE:-./data}:/data
      - ${FOREST_TOKEN_DATA:-./data/forest-token}:/forest-token:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - skiff-net
