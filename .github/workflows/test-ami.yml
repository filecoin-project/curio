name: Test AMI

on:
  pull_request:
    paths:
      - .github/workflows/test-ami.yml
      - scripts/ci-scripts/build-ami.sh

jobs:
  build:
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-test-ami/env=production/cpu=8/ram=16/family=c6a+c7a/image=ubuntu24-full-x64/volume=128gb:gp3

    steps:
    - uses: actions/checkout@v6
    - run: |
        sudo chmod +x ./scripts/ci-scripts/build-ami.sh
        sudo ./scripts/ci-scripts/build-ami.sh
      shell: bash
    - run: |
        sudo systemctl status postgresql@18-main.service
      if: ${{ failure() }}
      shell: bash
    - run: |
        sudo journalctl -xeu postgresql@18-main.service
      if: ${{ failure() }}
      shell: bash
